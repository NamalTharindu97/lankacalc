events {}

http {
  limit_req_zone $binary_remote_addr zone=calculation_api:10m rate=60r/m;

  server {
    listen 80;
    client_max_body_size 16k;
    error_page 429 = @rate_limited;

    location @rate_limited {
      internal;
      default_type application/json;
      add_header Retry-After 1 always;
      add_header X-Request-Id $request_id always;
      return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many calculation requests."}}';
    }

    location /api/v1/calculations/ {
      limit_req zone=calculation_api burst=10 nodelay;
      limit_req_status 429;
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
