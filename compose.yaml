services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lankacalc}
      POSTGRES_USER: ${POSTGRES_USER:-lankacalc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  web:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lankacalc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lankacalc}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped

  migrate:
    profiles: ["tools"]
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lankacalc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lankacalc}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
